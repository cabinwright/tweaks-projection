name=Navigation directions in the instrument cluster
summary=Shows your phone's next turn in front of you
description=Shows the next turn from Android Auto or Apple CarPlay navigation in the instrument cluster and head-up display, as the car's own navigation does. Takes effect after the head unit restarts, and turning it off takes the directions away again.
