name=ADB TCP and wireless projection together
summary=Keeps wireless Android Auto and CarPlay working with ADB TCP on
description=With the Engineering Mode "ADB TCP" setting on, wireless Android Auto and CarPlay can't connect. This fixes the cause for good, and works at once. Turning it off puts the original back.
