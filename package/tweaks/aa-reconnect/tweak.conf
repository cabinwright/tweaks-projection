name=Reconnect wireless Android Auto
summary=Reconnects wireless Android Auto
description=Sometimes, after the car's Wi-Fi hotspot has been used, wireless Android Auto stops connecting until the car is restarted. This fixes it automatically, so your phone connects again within a few seconds.
firmware=CVEV.USA.0000.V015.012.260507
kind=service
default=on
need=logs:AAProjection | Watch the Android Auto receiver's messages for the moment it gets stuck
need=kill:com.google.android.projection.sink | Restart the Android Auto receiver when it is stuck
