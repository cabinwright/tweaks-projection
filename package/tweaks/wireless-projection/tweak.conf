name=Wireless Android Auto and CarPlay
summary=Connects your phone without a cable
description=Lets your phone start Android Auto or Apple CarPlay over the car's own Wi-Fi, without a cable. Takes effect after the head unit restarts, and turning it off brings back the cable-only setup.
firmware=CVEV.USA.0000.V015.012.260507
